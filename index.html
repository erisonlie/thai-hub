.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .btn{margin:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0}
.th{font-size:1.5em;line-height:1.7}.big{font-size:2.6em;text-align:center;line-height:1.6}

.bad{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 18%,var(--cd))!important}

.tk{display:inline-block;margin:0 3px;cursor:pointer;border-bottom:1px dotted var(--mut)}
.tk small{display:block;font-size:.55em;line-height:1}
.dot{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8em;border:1px solid var(--bd)}
.s-g{color:var(--ok);border-color:var(--ok)}.s-y{color:var(--wr);border-color:var(--wr)}

#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;display:none;z-index:10;font-size:.9em}
